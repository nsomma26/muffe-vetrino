<text x="72" y="81.25" font-family="Arial, Helvetica, sans-serif" font-size="9px" font-weight="400" fill="#1A1A1A"><tspan x="72" dy="0">Nel Regno Unito il cibo commestibile</tspan><tspan x="72" dy="9">sprecato in casa cala del 21% fra 2007 e</tspan><tspan x="72" dy="9">2012. Documento pubblico indica la campagna</tspan><tspan x="72" dy="9">fra i probabili fattori.</tspan></text>
