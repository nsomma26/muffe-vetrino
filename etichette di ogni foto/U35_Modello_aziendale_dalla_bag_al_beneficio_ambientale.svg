<svg xmlns="http://www.w3.org/2000/svg" width="285" height="112" viewBox="0 0 285 112">
<title>U35 · Modello aziendale: dalla bag al beneficio ambientale</title>
<rect x="1" y="1" width="284" height="19" fill="#EAEAEA" stroke="#1A1A1A" stroke-width="1"/>
<text x="9" y="13.75" font-family="Arial, Helvetica, sans-serif" font-size="9px" font-weight="700" fill="#1A1A1A">MODELLO AZIENDALE: DALLA BAG AL BENEFICIO AMBIENTALE</text>
<rect x="1" y="20" width="65" height="17" fill="#AEAEAE" stroke="#1A1A1A" stroke-width="1"/>
<rect x="66" y="20" width="219" height="17" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text x="9.8" y="31.75" font-family="Arial, Helvetica, sans-serif" font-size="9px" font-weight="400" fill="#1A1A1A">Media</text>
<text x="72" y="31.75" font-family="Arial, Helvetica, sans-serif" font-size="9px" font-weight="400" fill="#1A1A1A">App / contatori e report aziendale</text>
<rect x="1" y="37" width="65" height="17" fill="#AEAEAE" stroke="#1A1A1A" stroke-width="1"/>
<rect x="66" y="37" width="219" height="17" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text x="9.8" y="48.75" font-family="Arial, Helvetica, sans-serif" font-size="9px" font-weight="400" fill="#1A1A1A">Paese</text>
<text x="72" y="48.75" font-family="Arial, Helvetica, sans-serif" font-size="9px" font-weight="400" fill="#1A1A1A" textLength="205" lengthAdjust="spacingAndGlyphs">Mercati 2022–2023; perimetro non dettagliato nella scheda</text>
<rect x="1" y="54" width="65" height="17" fill="#AEAEAE" stroke="#1A1A1A" stroke-width="1"/>
<rect x="66" y="54" width="219" height="17" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text x="9.8" y="65.75" font-family="Arial, Helvetica, sans-serif" font-size="9px" font-weight="400" fill="#1A1A1A">Anno</text>
<text x="72" y="65.75" font-family="Arial, Helvetica, sans-serif" font-size="9px" font-weight="400" fill="#1A1A1A">2024</text>
<rect x="1" y="71" width="65" height="41" fill="#AEAEAE" stroke="#1A1A1A" stroke-width="1"/>
<rect x="66" y="71" width="219" height="41" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1"/>
<text x="9.8" y="90.25" font-family="Arial, Helvetica, sans-serif" font-size="9px" font-weight="400" fill="#1A1A1A"><tspan x="9.8" dy="0">Impatto sul</tspan><tspan x="9.8" dy="9">pubblico</tspan></text>
<text x="72" y="81.25" font-family="Arial, Helvetica, sans-serif" font-size="9px" font-weight="400" fill="#1A1A1A"><tspan x="72" dy="0">Il modello assume vero surplus, 90%</tspan><tspan x="72" dy="9">consumato e sostituzione di acquisti. Una</tspan><tspan x="72" dy="9">bag è convenzionalmente 1 kg; non ogni bag è</tspan><tspan x="72" dy="9">pesata.</tspan></text>
</svg>